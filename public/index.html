<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Almoxarifado</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main>


<!-- ================================================ Tela de Login ================================================   -->

        <section id="login">
            <div class="titulo">
            <h1>Almoxarifado 📦</h1>
            </div>
           
            <form id="formLogin">
                <span>E-mail:</span>
                <input id="email" type="email" placeholder="admin@teste.com" required />
                
                <span>Senha:</span>
                <input id="senha" type="password"
                    placeholder="Senha" required />
                    <button>Entrar</button>
            </form>
            <p id="mensagem"></p>
            <small><strong>Teste:</strong> admin@teste.com / 123456</small>
        </section>

<!-- ================================================ Tela Inicial ================================================   -->


        <section id="sistema" hidden>
            <header>
                <h1>Sistema de Almoxarifado</h1>
                <span id="usuario"></span><button id="sair">Sair</button>
            </header>
            <nav>
                <button data-tela="produtos">Produtos</button><button data-tela="estoque">Estoque</button><button
                    data-tela="historico">Histórico</button>
            </nav><hr>

    <!-- ================================================ Seção de Produtos ================================================   -->

            <section id="produtos" class="tela">
                <h2>Produtos</h2>
                <form id="formProduto">
                    <input id="nome" placeholder="Nome" required /><input id="categoria" placeholder="Categoria"
                        required /><input id="quantidade" type="number" min="0" placeholder="Quantidade"
                        required /><input id="minimo" type="number" min="0" placeholder="Mínimo"
                        required /><button>Salvar</button><br>
                </form>
                <input id="busca" placeholder="Pesquisar 🔎" />
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Mínimo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </section>

    <!-- ================================================ Seção de Movimentação ================================================   -->

            <section id="estoque" class="tela" hidden>
                <h2>Movimentação</h2>
                <form id="formMov">
                    <select id="produto" required></select><select id="tipo">
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select><input id="qtdMov" type="number" min="1" required
                        placeholder="Quantidade" /><button>Registrar</button>
                </form>
                <p id="alerta"></p>
            </section>

    <!-- ================================================ Seção de Histórico ================================================   -->
            <section id="historico" class="tela" hidden>
                <h2>Histórico</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Usuário</th>
                            <th>Tipo</th>
                            <th>Quantidade</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody id="listaHistorico"></tbody>
                </table>
            </section>
             <p style="text-align: center;">Feito por Carina Cristina & Gustavo Nunes</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
